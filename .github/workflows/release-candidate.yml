name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Candidate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: macos-15
            bundle: app
          - os: macos-15-intel
            bundle: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install Ubuntu prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils ca-certificates
      - name: Resolve the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:native
      - name: Install the pinned notice generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Package an unsigned candidate with notices
        run: npm run package -- --bundles "${{ matrix.bundle }}" -- --locked
      - name: Collect packages, notices, build metadata and checksums
        run: node scripts/collect-artifacts.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blueprint-candidate-${{ matrix.os }}-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
