[package]
name = "blueprint"
version = "0.1.0"
description = "Visual authoring for GitHub Copilot dynamic workflows"
authors = ["Blueprint contributors"]
license = "MIT"
repository = "https://github.com/LazaroHurtado/blueprint"
homepage = "https://github.com/LazaroHurtado/blueprint"
publish = false
edition = "2021"
rust-version = "1.94"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blueprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
github-copilot-sdk = "=1.0.16"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
